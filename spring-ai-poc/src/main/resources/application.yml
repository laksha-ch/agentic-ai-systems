spring:
  application:
    name: spring-ai-poc
  ai:
    chat:
      client:
        enabled: false
    openai:
      api-key: ${OPENAI_API_KEY}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      model: claude-3-opus-20240229
    ollama:
      chat:
        options:
          model: llama3.2:3b
logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG